# Cau hinh Mosquitto cho bai thuc hanh MQTT
# Chay broker o che do foreground (tu thu muc repo):
#   "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v

# Nghe cong 1883 (cong MQTT mac dinh, khong TLS), chi tren may nay.
# Muon cho may khac trong mang LAN ket noi: doi thanh "listener 1883".
listener 1883 127.0.0.1

# Tu Mosquitto 2.0, khi da khai bao listener thi mac dinh TU CHOI client
# khong co username/password. Bai lab khong yeu cau xac thuc nen cho phep an danh.
allow_anonymous true
